<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- arena402 — Pixel Silhouette Profile -->
  <!-- 10×10 pixel grid, each cell = 10×10 units -->
  <g fill="currentColor">
    <!-- Row 1: hair top -->
    <rect x="30" y="10" width="10" height="10"/>
    <rect x="40" y="10" width="10" height="10"/>
    <rect x="50" y="10" width="10" height="10"/>
    <rect x="60" y="10" width="10" height="10"/>

    <!-- Row 2: forehead + hair -->
    <rect x="20" y="20" width="10" height="10"/>
    <rect x="30" y="20" width="10" height="10"/>
    <rect x="40" y="20" width="10" height="10"/>
    <rect x="50" y="20" width="10" height="10"/>
    <rect x="60" y="20" width="10" height="10"/>

    <!-- Row 3: forehead -->
    <rect x="20" y="30" width="10" height="10"/>
    <rect x="30" y="30" width="10" height="10"/>
    <rect x="40" y="30" width="10" height="10"/>
    <rect x="50" y="30" width="10" height="10"/>
    <rect x="60" y="30" width="10" height="10"/>

    <!-- Row 4: brow + nose bridge -->
    <rect x="10" y="40" width="10" height="10"/>
    <rect x="20" y="40" width="10" height="10"/>
    <rect x="30" y="40" width="10" height="10"/>
    <rect x="40" y="40" width="10" height="10"/>
    <rect x="50" y="40" width="10" height="10"/>
    <rect x="60" y="40" width="10" height="10"/>
    <rect x="70" y="40" width="10" height="10"/>

    <!-- Row 5: eye + nose tip -->
    <rect x="10" y="50" width="10" height="10"/>
    <rect x="20" y="50" width="10" height="10"/>
    <rect x="30" y="50" width="10" height="10"/>
    <rect x="40" y="50" width="10" height="10"/>
    <rect x="50" y="50" width="10" height="10"/>
    <rect x="60" y="50" width="10" height="10"/>
    <rect x="70" y="50" width="10" height="10"/>
    <rect x="80" y="50" width="10" height="10"/>

    <!-- Row 6: cheek + upper lip -->
    <rect x="10" y="60" width="10" height="10"/>
    <rect x="20" y="60" width="10" height="10"/>
    <rect x="30" y="60" width="10" height="10"/>
    <rect x="40" y="60" width="10" height="10"/>
    <rect x="50" y="60" width="10" height="10"/>
    <rect x="60" y="60" width="10" height="10"/>
    <rect x="70" y="60" width="10" height="10"/>
    <rect x="80" y="60" width="10" height="10"/>

    <!-- Row 7: mouth + chin -->
    <rect x="10" y="70" width="10" height="10"/>
    <rect x="20" y="70" width="10" height="10"/>
    <rect x="30" y="70" width="10" height="10"/>
    <rect x="40" y="70" width="10" height="10"/>
    <rect x="50" y="70" width="10" height="10"/>
    <rect x="70" y="70" width="10" height="10"/>
    <rect x="80" y="70" width="10" height="10"/>

    <!-- Row 8: jaw + neck -->
    <rect x="10" y="80" width="10" height="10"/>
    <rect x="20" y="80" width="10" height="10"/>
    <rect x="30" y="80" width="10" height="10"/>
    <rect x="40" y="80" width="10" height="10"/>

    <!-- Row 9: neck -->
    <rect x="20" y="90" width="10" height="10"/>
    <rect x="30" y="90" width="10" height="10"/>
  </g>
</svg>
