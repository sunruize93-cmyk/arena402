<!-- OAuth return veil — covers flash while session restores -->
<div id="auth-veil" class="auth-veil" aria-hidden="true" role="status">
  <div class="auth-veil-inner">
    <p class="label">Re-entering the board</p>
    <p class="display auth-veil-title">Signing you in</p>
    <p class="auth-veil-pulse" aria-hidden="true">♟</p>
  </div>
</div>

<nav class="nav">

  <div class="nav-links right">
    <button class="nav-link" data-nav="market" onclick="A.nav('market')">Market</button>

    <!-- shown when logged out -->
    <span id="nav-unsigned" class="nav-auth nav-auth-out">
      <button type="button" class="nav-signin" onclick="A.signIn()">
        <span class="nav-signin-label">Sign in</span>
        <span class="nav-signin-rule" aria-hidden="true"></span>
      </button>
    </span>

    <!-- shown when logged in -->
    <span id="nav-signed" class="nav-auth nav-auth-in" hidden>
      <button type="button" class="nav-deploy" onclick="A.nav('agents')">Deploy</button>
      <div class="nav-user" id="nav-user">
        <button type="button" class="nav-user-trigger" id="nav-user-btn"
          aria-haspopup="menu" aria-expanded="false" aria-controls="nav-user-menu"
          onclick="event.stopPropagation(); A.toggleUserMenu()"></button>
      </div>
    </span>
  </div>
</nav>

<div class="nav-user-menu" id="nav-user-menu" role="menu" hidden></div>
